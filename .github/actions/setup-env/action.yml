name: "Setup Environment"
description: "Set up managed Python, install uv, and sync dependencies"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.11.7"
        enable-cache: true

    - name: Install the project
      shell: bash
      run: uv sync --locked --all-extras --dev
